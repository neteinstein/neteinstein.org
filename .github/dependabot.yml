# Weekly dependency updates, grouped so a normal week is one PR per ecosystem.
# CI (format, lint, typecheck, build, link checks, Lighthouse) gates every one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      minor-and-patch:
        update-types: [minor, patch]
        # astro pins @astrojs/markdown-remark exactly, so they must move together.
        exclude-patterns: ['astro', '@astrojs/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
