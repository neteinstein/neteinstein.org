name: lighthouse

# Accessibility, SEO and best-practice scores for a sample of pages (see
# lighthouserc.json). Kept out of `ci.yml` so the validate job stays exactly the
# commands contributors run locally; performance only warns, since a shared
# runner's timings vary from run to run.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
