name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for GitHub Pages: read the repo, publish Pages, and mint the
# OIDC token deploy-pages uses to prove where the artifact came from.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two production deploys race; queue them instead of cancelling, so
# the last merge to land is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Reports where Pages will serve the site. `base_path` is empty once the
      # custom domain is attached, and `/<repo>` while the site still lives at
      # `<owner>.github.io/<repo>/` — the build prefixes every link with it.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Check internal links
        run: npm run check:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
